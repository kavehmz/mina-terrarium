  <text x="620" y="348" font-size="13.5" fill="#6B4BC4" font-style="italic">“Leyla&#x27;s asking about Saturday. Quick reply now… then back to work.”</text>
  <rect x="40" y="378" width="16" height="10" fill="#9A6512" opacity="0.3"/><text x="62" y="387" font-size="12.5" fill="#5A6570">Jev’s answer each tick (how true the feeling is, 0 to 1)</text>
  <line x1="440" y1="383" x2="462" y2="383" stroke="#22272B" stroke-width="3"/><text x="468" y="387" font-size="12.5" fill="#5A6570">the charge: it leaks a little each tick and adds the new answer</text>
