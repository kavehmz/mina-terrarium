  <rect x="0.5" y="0.5" width="1199" height="409" fill="none" stroke="#D4D8D0"/>
  <text x="40" y="50" font-size="26" font-weight="700" fill="#22272B">Watch a feeling fill up</text>
  <text x="40" y="76" font-size="14" fill="#5A6570">Real ticks from two runs. A half-true feeling that lasts fills slowly; a sudden, clear one crosses fast. One blip never fires.</text>
  <text x="40" y="110" font-size="16" font-weight="700" fill="#22272B">Slow: her body, while she showers</text>
  <text x="40" y="130" font-size="12.5" fill="#5A6570">Tuesday 07:03 → 07:16, 17 ticks</text>
