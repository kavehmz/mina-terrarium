<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 410" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
  <title>Watch a feeling fill up</title>
  <desc>Two charts from real tick logs. Left: while Mina showers, Jev says her body needs something at about 0.3 to 0.5 each tick; the charge climbs over 17 ticks to the line at 2 and fires; her thought: Shower&#x27;s done its job, I&#x27;m starving. Right: the someone feeling idles low, a text from Leyla arrives, Jev jumps to 0.85 and the charge crosses the line within three ticks; her thought: Leyla&#x27;s asking about Saturday, quick reply now.</desc>
